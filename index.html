<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>静电场 · 扫雷 · 自定义</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #060a10;
            overflow: hidden;
            font-family: system-ui, -apple-system, "PingFang SC", monospace;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game { display: block; width: 100%; height: 100%; touch-action: none; }

        /* ===== 顶部 HUD ===== */
        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: center;
            padding: 8px 12px;
            pointer-events: none;
            z-index: 20;
        }
        .hud-panel {
            background: rgba(12, 22, 32, 0.92);
            border: 1.5px solid #2d5a6e;
            border-radius: 12px;
            padding: 6px 14px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: flex; gap: 14px; align-items: center;
            pointer-events: auto;
        }
        .stat {
            display: flex; flex-direction: column; align-items: center;
            min-width: 58px;
        }
        .stat-label {
            font-size: 9px; color: #5e8fa8;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 2px; font-weight: 600;
        }
        .stat-value {
            font-size: 18px; font-weight: 800;
            color: #d4f0ff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 0 12px rgba(100, 180, 255, 0.4);
            white-space: nowrap;
        }
        .stat.mines .stat-value { color: #ff8a8a; text-shadow: 0 0 14px rgba(255,100,100,0.5); }
        .stat.timer .stat-value { color: #7dd8a0; text-shadow: 0 0 12px rgba(125,216,160,0.4); }
        #resetBtn {
            width: 38px; height: 38px;
            background: rgba(20, 40, 55, 0.9);
            border: 1.5px solid #3d7186;
            border-radius: 10px;
            color: #8fc4dd;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        #resetBtn:hover {
            background: rgba(45, 110, 150, 0.95);
            border-color: #6ad4ff;
            box-shadow: 0 0 12px rgba(106,212,255,0.4);
        }

        /* ===== 道具栏 ===== */
        #itemBar {
            position: fixed;
            bottom: 62px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px;
            z-index: 25;
            padding: 8px 12px;
            background: rgba(12, 22, 32, 0.92);
            border: 1.5px solid #2d5a6e;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s;
        }
        #itemBar.visible { opacity: 1; visibility: visible; }
        .item-slot {
            width: 58px; height: 64px;
            background: rgba(20, 40, 55, 0.75);
            border: 1.5px solid #2d5a6e;
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.18s ease;
            position: relative;
        }
        .item-slot:hover:not(.empty):not(.disabled) {
            background: rgba(35, 70, 95, 0.95);
            border-color: #5aa8cc;
            transform: translateY(-2px);
        }
        .item-slot.active {
            background: rgba(45, 110, 150, 0.95);
            border-color: #6ad4ff;
            box-shadow: 0 0 16px rgba(106,212,255,0.6);
            transform: translateY(-2px);
        }
        .item-slot.empty, .item-slot.disabled {
            opacity: 0.28;
            cursor: not-allowed;
        }
        .item-slot .item-icon {
            font-size: 22px;
            line-height: 1;
            margin-bottom: 2px;
        }
        .item-slot .item-name {
            font-size: 9px;
            font-weight: 700;
            color: #a8c8dc;
        }
        .item-slot .item-count {
            position: absolute;
            top: -6px; right: -6px;
            background: #2d7fb8;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            min-width: 20px; height: 20px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 10px rgba(106,212,255,0.4);
            border: 1.5px solid #b0e0ff;
        }
        .item-slot.active .item-count {
            background: #2ed573;
            border-color: #b0ffc8;
        }
        .item-slot .item-key {
            position: absolute;
            top: 2px; left: 4px;
            font-size: 8px;
            font-weight: 700;
            color: #4a7a92;
            font-family: monospace;
        }

        /* ===== Toast ===== */
        #toast {
            position: fixed; bottom: 156px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 30, 45, 0.94);
            color: #a8d8ff; padding: 9px 22px;
            border-radius: 30px; font-size: 13px;
            border: 1px solid #3d7186;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            opacity: 0; transition: all 0.35s ease;
            pointer-events: none; z-index: 30;
            font-weight: 600;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: #2ed573; color: #b0ffc8; }
        #toast.warn { border-color: #ffa502; color: #ffe0a0; }
        #toast.item { border-color: #b06cff; color: #e0d0ff; }

        /* ===== 底部提示 ===== */
        #hintBar {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 22, 32, 0.88);
            border: 1.5px solid #2d5a6e;
            border-radius: 12px;
            padding: 5px 16px;
            color: #8fc4dd;
            font-size: 10.5px;
            z-index: 20;
            pointer-events: none;
            display: flex; gap: 12px;
            white-space: nowrap;
            opacity: 0; transition: opacity 0.4s;
        }
        #hintBar.visible { opacity: 1; }
        #hintBar kbd {
            background: rgba(45, 110, 150, 0.5);
            border: 1px solid #3d7186;
            border-radius: 4px;
            padding: 1px 5px;
            font-family: monospace;
            color: #b0e0ff;
            font-weight: 700;
            margin-right: 2px;
        }

        /* ===== 菜单按钮 ===== */
        #menuBtn {
            position: fixed; top: 10px; right: 10px;
            width: 40px; height: 40px;
            background: rgba(20, 40, 55, 0.85);
            border: 1.5px solid #3d7186;
            border-radius: 10px;
            color: #8fc4dd;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
            opacity: 0; visibility: hidden;
            transition: all 0.2s;
        }
        #menuBtn.visible { opacity: 1; visibility: visible; }
        #menuBtn:hover {
            background: rgba(35, 70, 95, 0.95);
            border-color: #6ad4ff;
            color: #ffffff;
        }

        /* ===== 开始界面 ===== */
        #startScreen {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, #0f1e2e 0%, #060a10 100%);
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease, visibility 0.5s;
            overflow-y: auto; padding: 24px 16px 40px 16px;
        }
        #startScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .start-logo {
            font-size: 38px; font-weight: 900;
            color: #a8d8ff;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.6);
            margin-bottom: 4px;
            animation: logoFloat 3s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .start-sub {
            color: #5e8fa8; font-size: 11px;
            letter-spacing: 4px; margin-bottom: 16px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .start-label {
            color: #6b9fc0; font-size: 11px; letter-spacing: 2.5px;
            margin-bottom: 10px; text-transform: uppercase;
            text-align: center; font-weight: 600;
        }

        /* 难度卡片 */
        .start-grid {
            display: grid; gap: 8px;
            max-width: 560px; width: 100%;
            margin-bottom: 16px;
        }
        .start-grid.diff-grid { grid-template-columns: repeat(4, 1fr); }

        .diff-card {
            background: rgba(20, 40, 55, 0.7);
            border: 1.5px solid #2d5a6e;
            color: #8fc4dd;
            padding: 12px 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            line-height: 1.4;
        }
        .diff-card:hover {
            background: rgba(35, 70, 95, 0.9);
            border-color: #5aa8cc;
            color: #d4f0ff;
            transform: translateY(-2px);
        }
        .diff-card.selected {
            background: rgba(45, 110, 150, 0.85);
            border-color: #6ad4ff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(106, 212, 255, 0.5);
        }
        .diff-card .diff-icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .diff-card .diff-desc {
            font-size: 9.5px; color: #6b9fc0;
            font-weight: 400; margin-top: 4px; display: block;
        }
        .diff-card.selected .diff-desc { color: #b0e0ff; }
        .diff-card .diff-best {
            font-size: 9px; color: #4a7a92;
            margin-top: 3px; font-weight: 400;
            display: block;
            min-height: 11px;
        }
        .diff-card .diff-best.has-best { color: #ffd966; }

        /* 自定义面板 */
        #customPanel {
            max-width: 560px; width: 100%;
            background: rgba(15, 28, 38, 0.85);
            border: 1.5px solid #2d5a6e;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease, margin 0.3s ease;
        }
        #customPanel.open {
            display: block;
            max-height: 1000px;
        }
        .custom-section {
            margin-bottom: 14px;
        }
        .custom-section:last-child { margin-bottom: 0; }
        .custom-section-title {
            color: #6ad4ff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .custom-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .custom-row label {
            color: #8fc4dd;
            font-size: 12px;
            font-weight: 600;
            min-width: 68px;
            letter-spacing: 0.3px;
        }
        .custom-row input[type="number"] {
            background: rgba(10, 20, 30, 0.9);
            border: 1.5px solid #2d5a6e;
            border-radius: 8px;
            color: #d4f0ff;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            width: 80px;
            outline: none;
            transition: border-color 0.2s;
        }
        .custom-row input[type="number"]:focus {
            border-color: #6ad4ff;
            box-shadow: 0 0 8px rgba(106,212,255,0.3);
        }
        .custom-row input[type="range"] {
            flex: 1;
            accent-color: #6ad4ff;
            height: 4px;
        }
        .custom-row .range-val {
            color: #ffd966;
            font-size: 12px;
            font-weight: 800;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 复选框组 */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #a8c8dc;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .checkbox-item:hover {
            background: rgba(45, 110, 150, 0.2);
        }
        .checkbox-item input[type="checkbox"] {
            appearance: none;
            width: 16px; height: 16px;
            border: 1.5px solid #3d7186;
            border-radius: 4px;
            background: rgba(10, 20, 30, 0.9);
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            margin: 0;
            flex-shrink: 0;
        }
        .checkbox-item input[type="checkbox"]:checked {
            background: #2d7fb8;
            border-color: #6ad4ff;
            box-shadow: 0 0 8px rgba(106,212,255,0.4);
        }
        .checkbox-item input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            line-height: 1;
        }
        .checkbox-item.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* 地雷类型说明小标签 */
        .mine-type-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .mine-type-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(20, 40, 55, 0.7);
            border: 1px solid #2d5a6e;
            color: #8fc4dd;
            font-weight: 600;
        }
        .mine-type-tag .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .mine-type-tag .dot.point { background: #ff5c6c; }
        .mine-type-tag .dot.hring {
            width: 12px; height: 7px;
            border-radius: 50%;
            background: #ff9f43;
        }
        .mine-type-tag .dot.vring {
            width: 7px; height: 12px;
            border-radius: 50%;
            background: #b06cff;
        }

        .start-play {
            background: linear-gradient(135deg, #1e6b8c, #2d8fb5);
            border: 2px solid #6ad4ff;
            color: #ffffff;
            padding: 13px 64px;
            border-radius: 50px;
            font-size: 16px; font-weight: 900;
            letter-spacing: 5px; cursor: pointer;
            box-shadow: 0 8px 28px rgba(45, 143, 181, 0.6);
            transition: all 0.2s ease;
            animation: playPulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 28px rgba(45, 143, 181, 0.6); }
            50% { box-shadow: 0 8px 28px rgba(45, 143, 181, 0.8), 0 0 50px rgba(106, 212, 255, 0.6); }
        }
        .start-play:hover { transform: translateY(-3px) scale(1.03); }
        .start-play:active { transform: translateY(0) scale(1); }

        /* ===== 暂停 / 结果 ===== */
        #pauseScreen, #resultScreen {
            position: fixed; inset: 0;
            background: rgba(6, 10, 18, 0.92);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 150;
            transition: opacity 0.3s ease, visibility 0.3s;
        }
        #resultScreen { z-index: 140; }
        #pauseScreen.hidden, #resultScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .pause-title {
            color: #a8d8ff; font-size: 24px; font-weight: 800;
            letter-spacing: 4px; margin-bottom: 24px;
        }
        .pause-btn {
            background: rgba(20, 40, 55, 0.9);
            border: 1.5px solid #3d7186;
            color: #8fc4dd;
            padding: 12px 42px;
            border-radius: 40px;
            font-size: 14px; font-weight: 700;
            letter-spacing: 2px; cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            min-width: 210px;
        }
        .pause-btn:hover {
            background: rgba(45, 110, 150, 0.9);
            border-color: #6ad4ff;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .pause-btn.primary {
            background: linear-gradient(135deg, #1e6b8c, #2d8fb5);
            border-color: #6ad4ff;
            color: #ffffff;
        }
        .result-icon {
            font-size: 68px; margin-bottom: 12px;
            animation: iconPop 0.5s ease-out;
        }
        @keyframes iconPop {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .result-title {
            color: #d4f0ff; font-size: 22px; font-weight: 800;
            letter-spacing: 4px; margin-bottom: 16px;
        }
        .result-title.win { color: #2ed573; }
        .result-title.lose { color: #ff4757; }
        .result-stats {
            display: flex; gap: 22px;
            margin-bottom: 22px;
            padding: 12px 28px;
            background: rgba(20, 40, 55, 0.6);
            border: 1px solid #2d5a6e;
            border-radius: 14px;
        }
        .result-stat {
            display: flex; flex-direction: column; align-items: center;
            min-width: 74px;
        }
        .result-stat .rs-label {
            font-size: 10px; color: #5e8fa8;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 5px; font-weight: 600;
        }
        .result-stat .rs-value {
            font-size: 20px; font-weight: 800;
            color: #d4f0ff;
            font-variant-numeric: tabular-nums;
        }
        .result-stat .rs-value.gold { color: #ffd966; }
        .result-stat .rs-unit {
            font-size: 10px; color: #4a7a92;
            margin-top: 3px;
        }
        .result-buttons { display: flex; gap: 12px; }
        .result-btn {
            background: rgba(20, 40, 55, 0.9);
            border: 1.5px solid #3d7186;
            color: #8fc4dd;
            padding: 11px 32px;
            border-radius: 40px;
            font-size: 13px; font-weight: 700;
            letter-spacing: 2px; cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
        }
        .result-btn:hover {
            background: rgba(45, 110, 150, 0.9);
            border-color: #6ad4ff;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .result-btn.primary {
            background: linear-gradient(135deg, #1e6b8c, #2d8fb5);
            border-color: #6ad4ff;
            color: #ffffff;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 顶部 HUD -->
<div id="hud">
    <div class="hud-panel">
        <div class="stat mines">
            <div class="stat-label">⚡ 剩余</div>
            <div class="stat-value" id="mineCount">10</div>
        </div>
        <button id="resetBtn" title="重新开始">🔄</button>
        <div class="stat timer">
            <div class="stat-label">⏱ 时间</div>
            <div class="stat-value"><span id="timer">0</span><span style="font-size:10px;color:#5e8fa8;">s</span></div>
        </div>
    </div>
</div>

<!-- 道具栏 -->
<div id="itemBar">
    <div class="item-slot" data-item="probe">
        <div class="item-key">1</div>
        <div class="item-icon">🔍</div>
        <div class="item-name">探测</div>
        <div class="item-count" id="countProbe">0</div>
    </div>
    <div class="item-slot" data-item="scan">
        <div class="item-key">2</div>
        <div class="item-icon">📡</div>
        <div class="item-name">扫描</div>
        <div class="item-count" id="countScan">0</div>
    </div>
    <div class="item-slot" data-item="vector">
        <div class="item-key">3</div>
        <div class="item-icon">➡️</div>
        <div class="item-name">矢量</div>
        <div class="item-count" id="countVector">0</div>
    </div>
    <div class="item-slot" data-item="locate">
        <div class="item-key">4</div>
        <div class="item-icon">🎯</div>
        <div class="item-name">定位</div>
        <div class="item-count" id="countLocate">0</div>
    </div>
    <div class="item-slot" data-item="shield">
        <div class="item-key">5</div>
        <div class="item-icon">🛡️</div>
        <div class="item-name">护盾</div>
        <div class="item-count" id="countShield">0</div>
    </div>
</div>

<!-- 底部提示 -->
<div id="hintBar">
    <span><kbd>左键</kbd> 探测</span>
    <span><kbd>右键/长按</kbd> 标记</span>
    <span><kbd>1-5</kbd> 道具</span>
    <span><kbd>R</kbd> 重开</span>
</div>

<!-- 提示 -->
<div id="toast"></div>

<!-- 菜单按钮 -->
<button id="menuBtn" title="菜单">☰</button>

<!-- ===== 开始界面 ===== -->
<div id="startScreen">
    <div class="start-logo">⚡ 静电场扫雷</div>
    <div class="start-sub">道具 · 探测 · 自定义</div>

    <div class="start-label">选择难度</div>
    <div class="start-grid diff-grid" id="startDiffGrid">
        <div class="diff-card selected" data-diff="easy">
            <span class="diff-icon">🟢</span>
            简单
            <span class="diff-desc">9 × 9 · 10</span>
            <span class="diff-best" id="bestEasy"></span>
        </div>
        <div class="diff-card" data-diff="medium">
            <span class="diff-icon">🟡</span>
            中等
            <span class="diff-desc">12 × 12 · 22</span>
            <span class="diff-best" id="bestMedium"></span>
        </div>
        <div class="diff-card" data-diff="hard">
            <span class="diff-icon">🔴</span>
            困难
            <span class="diff-desc">16 × 16 · 40</span>
